name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q backend train_model.py
      - name: Rebuild model artifacts with the pinned environment
        env:
          LOAN_CI_FAST: "1"
        run: python train_model.py
      - name: Run API tests
        run: pytest -q
